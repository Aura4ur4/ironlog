/* ===== Live workout mode ===== */
let finishing = false;
let restOverUntil = 0;
let wakeLock = null;

function lastSets(exId, beforeId) {
  const fin = finishedSessions();
  for (let i = fin.length - 1; i >= 0; i--) {
    const s = fin[i];
    if (s.id === beforeId) continue;
    for (const ex of s.exercises) {
      if (ex.exId !== exId) continue;
      const sets = ex.sets.filter(x => x.done && x.r > 0);
      if (sets.length) return { date: s.start, sets };
    }
  }
  return null;
}

// Make sure the suggestion reflects the latest logged session for this exercise.
function ensureSuggestion(exId, target) {
  const h = history(exId);
  if (!h.length) return;
  const last = h[h.length - 1];
  const sg = S.suggestions[exId];
  if (sg && sg.sessionId === last.sessionId) return;
  const ex = exById(exId);
  const t = Object.assign({ repMin: ex.repMin, repMax: ex.repMax }, target || {}, { sets: last.sets.length });
  const next = GL.suggestNext(ex, t, h, U());
  if (next) { S.suggestions[exId] = Object.assign(next, { status: 'pending', sessionId: last.sessionId, created: Date.now() }); save.suggestions(); }
}

function newWex(exId, pe) {
  const ex = exById(exId);
  const t = pe ? { sets: pe.sets, repMin: pe.repMin, repMax: pe.repMax, weight: pe.weight }
    : { sets: 3, repMin: ex.repMin, repMax: ex.repMax, weight: null };
  return {
    k: GL.uid(), exId, rest: (pe && pe.rest) || ex.rest || S.settings.defaultRest, target: t, notes: '', showNotes: false,
    sets: Array.from({ length: t.sets }, () => ({ w: null, r: null, done: false }))
  };
}

async function startWorkout(plan, day) {
  if (S.active) {
    const c = await actionSheet('A workout is already in progress', [
      { label: 'Resume ' + S.active.name, value: 'resume' },
      { label: 'Discard it and start new', value: 'new', danger: true }
    ]);
    if (c === 'resume') return openWorkout();
    if (c !== 'new') return;
  }
  S.active = {
    id: GL.uid(), name: day ? day.name : 'Workout', planId: plan ? plan.id : null, dayId: day ? day.id : null,
    start: Date.now(), notes: '', restEnd: null, restTotal: 0,
    exercises: day ? day.exercises.map(pe => newWex(pe.exId, pe)) : []
  };
  saveActive(true);
  DB.persist();
  openWorkout();
  haptic();
}

function openWorkout() {
  if (!S.active) return;
  S.ui.wkOpen = true;
  $('#workout').classList.remove('away');
  $('#workout').removeAttribute('aria-hidden');
  renderWorkout();
  updateResume();
  requestWakeLock();
}
function minimizeWorkout() {
  S.ui.wkOpen = false;
  $('#workout').classList.add('away');
  $('#workout').setAttribute('aria-hidden', 'true');
  render();
}

// placeholder values shown in empty inputs; tapping ✓ uses them
function placeholder(wex, i, prev) {
  const set = wex.sets[i];
  const sg = S.suggestions[wex.exId];
  const p = prev && prev.sets[i];
  if (sg && sg.status === 'accepted' && (sg.kind === 'up' || sg.kind === 'down') && !set.warmup) {
    return { w: sg.weight, r: p && Math.abs(p.w - sg.weight) < 1e-6 ? p.r : sg.repMin };
  }
  if (p) return { w: p.w, r: p.r };
  for (let j = i - 1; j >= 0; j--) {
    const s = wex.sets[j];
    if (s.w != null || s.done) return { w: s.w, r: s.r != null ? s.r : wex.target.repMin };
  }
  const ex = exById(wex.exId);
  return { w: wex.target.weight != null ? wex.target.weight : (ex.equipment === 'bodyweight' ? 0 : null), r: wex.target.repMin };
}

function wkStats() {
  const a = S.active; let done = 0, total = 0, v = 0;
  for (const e of a.exercises) for (const s of e.sets) { total++; if (s.done) { done++; if (!s.warmup) v += (s.w || 0) * (s.r || 0); } }
  return { done, total, v };
}

function renderWorkout() {
  const a = S.active;
  if (!a) return;
  $('#wk-title').textContent = a.name;
  const st = wkStats();
  const cards = a.exercises.map((wex, ei) => {
    const ex = exById(wex.exId);
    const prev = lastSets(wex.exId, a.id);
    ensureSuggestion(wex.exId, wex.target);
    const sg = S.suggestions[wex.exId];
    let n = 0;
    const rows = wex.sets.map((s, si) => {
      const ph = placeholder(wex, si, prev);
      const label = s.warmup ? 'W' : String(++n);
      const pv = prev && prev.sets[si] ? setStr(prev.sets[si]) : '–';
      return `<tr class="${s.done ? 'done' : ''}">
        <td><button class="setno ${s.warmup ? 'w' : ''}" data-a="setNo" data-e="${ei}" data-s="${si}" aria-label="Set ${label} options">${label}</button></td>
        <td class="pv">${esc(pv)}</td>
        <td><input inputmode="decimal" enterkeyhint="next" data-in="wi" data-f="w" data-e="${ei}" data-s="${si}" value="${s.w != null ? w(s.w) : ''}" placeholder="${ph.w != null ? w(ph.w) : U()}" aria-label="Set ${label} weight in ${U()}"></td>
        <td><input inputmode="numeric" enterkeyhint="done" data-in="wi" data-f="r" data-e="${ei}" data-s="${si}" value="${s.r != null ? s.r : ''}" placeholder="${ph.r != null ? ph.r : '–'}" aria-label="Set ${label} reps"></td>
        <td><button class="chk" data-a="setChk" data-e="${ei}" data-s="${si}" aria-pressed="${s.done}" aria-label="${s.done ? 'Undo' : 'Complete'} set ${label}">${I.check}</button></td></tr>`;
    }).join('');
    return `<section class="exc" aria-label="${esc(ex.name)}">
      <div class="exc-h"><div class="grow"><button class="name" data-a="exMore" data-e="${ei}">${esc(ex.name)}</button>
        <div class="meta">${esc(GL.MUSCLE_NAME[ex.muscle])} · ${esc(GL.EQUIPMENT_NAME[ex.equipment] || '')} · goal ${wex.target.repMin}–${wex.target.repMax} reps · rest ${restLabel(wex.rest)}</div></div>
        <button class="more" data-a="exMore" data-e="${ei}" aria-label="Options for ${esc(ex.name)}">${I.more}</button></div>
      <div class="prev">${prev ? `Last time, ${esc(relDay(prev.date).toLowerCase() === 'today' ? 'today' : relDay(prev.date))}: ${esc(prev.sets.map(setStr).join(' · '))}` : 'First time logging this exercise'}</div>
      ${sg && (sg.status === 'pending' || sg.status === 'accepted') && sg.sessionId !== a.id ? sugBlock(wex.exId) : ''}
      <table class="sets"><thead><tr><th>Set</th><th class="prevh">Previous</th><th>${U()}</th><th>Reps</th><th><span class="hidden">Done</span>${I.check.replace('<svg', '<svg width="14" height="14" style="vertical-align:-2px"')}</th></tr></thead><tbody>${rows}</tbody></table>
      ${wex.showNotes || wex.notes ? `<textarea class="note-in" rows="1" data-in="exNote" data-e="${ei}" placeholder="Notes: form, seat height, how it felt">${esc(wex.notes)}</textarea>` : ''}
      <button class="addset" data-a="addSet" data-e="${ei}">${I.plus} Add set</button></section>`;
  }).join('');
  $('#wk-inner').innerHTML = `
    <div class="wk-clock"><div><b id="wk-elapsed">${fmtDur(Date.now() - a.start)}</b>Duration</div><div><b>${GL.fmtVolume(st.v, U())}</b>Volume, ${U()}</div><div><b>${st.done}/${st.total}</b>Sets</div></div>
    ${cards || `<div class="empty"><b>No exercises yet</b>Add the exercises you're doing today.</div>`}
    <button class="btn block secondary" data-a="wkAddEx">${I.plus} Add exercise</button>
    <label class="field" style="margin-top:14px"><span>Workout notes</span><textarea data-in="wkNote" rows="2" placeholder="Energy, sleep, anything worth remembering">${esc(a.notes || '')}</textarea></label>
    <button class="btn block danger" data-a="wkDiscard">Discard workout</button>`;
  $('#wk-sub').textContent = fmtDur(Date.now() - a.start);
  updateRest();
}

async function completeSet(ei, si) {
  const a = S.active; const wex = a.exercises[ei]; const s = wex.sets[si];
  primeAudio();
  if (s.done) { s.done = false; s.doneAt = null; saveActive(true); renderWorkout(); return; }
  const ph = placeholder(wex, si, lastSets(wex.exId, a.id));
  const wv = s.w != null ? s.w : ph.w;
  const rv = s.r != null ? s.r : ph.r;
  const ex = exById(wex.exId);
  if (wv == null && ex.equipment !== 'bodyweight') { toast('Enter the weight first'); focusInput(ei, si, 'w'); return; }
  if (!rv) { toast('Enter reps first'); focusInput(ei, si, 'r'); return; }
  s.w = wv == null ? 0 : wv; s.r = rv; s.done = true; s.doneAt = Date.now();
  haptic();
  const isLast = wex.sets.every(x => x.done) && ei === a.exercises.length - 1;
  if (!isLast) startRest(s.warmup ? Math.min(60, wex.rest) : wex.rest);
  saveActive(true);
  renderWorkout();
}
function focusInput(ei, si, f) {
  const el = $(`#wk-inner input[data-e="${ei}"][data-s="${si}"][data-f="${f}"]`);
  if (el) { el.focus(); el.select && el.select(); }
}

// ---------- rest timer ----------
function startRest(sec) {
  const a = S.active; if (!a) return;
  a.restTotal = sec; a.restEnd = Date.now() + sec * 1000;
  restOverUntil = 0;
  updateRest();
}
function updateRest() {
  const el = $('#rest'); const a = S.active;
  if (!a) { el.classList.add('off'); return; }
  const now = Date.now();
  if (a.restEnd) {
    const rem = a.restEnd - now;
    if (rem <= 0) {
      const late = rem < -10000;
      a.restEnd = null; saveActive();
      if (!late) { beep(); haptic(true); restOverUntil = now + 4000; }
    }
  }
  const showOver = !a.restEnd && now < restOverUntil;
  const on = (a.restEnd || showOver) && S.ui.wkOpen;
  el.classList.toggle('off', !on);
  el.classList.toggle('over', showOver);
  if (a.restEnd) {
    const rem = Math.max(0, a.restEnd - now);
    $('#rest-time').firstChild.nodeValue = fmtDur(rem + 999);
    $('#rest-label').textContent = 'Rest · ' + restLabel(a.restTotal);
    $('#rest-bar').style.transform = `scaleX(${a.restTotal ? rem / (a.restTotal * 1000) : 0})`;
  } else if (showOver) {
    $('#rest-time').firstChild.nodeValue = 'Go';
    $('#rest-label').textContent = 'Rest is over, next set';
    $('#rest-bar').style.transform = 'scaleX(0)';
  }
}

// ---------- finish / discard ----------
async function finishWorkout() {
  const a = S.active; if (!a || finishing) return;
  const st = wkStats();
  if (!st.done) {
    const ok = await confirmDialog('No sets completed', 'Check off at least one set to save this workout, or discard it.', 'Discard workout', true);
    if (ok) discardWorkout(true);
    return;
  }
  const undone = st.total - st.done;
  if (undone) {
    const ok = await confirmDialog('Finish workout?', `${undone} unchecked set${undone === 1 ? '' : 's'} won't be saved.`, 'Finish workout');
    if (!ok) return;
  }
  finishing = true;
  try {
    const s = {
      id: a.id, name: a.name, planId: a.planId, dayId: a.dayId, start: a.start, end: Date.now(), notes: (a.notes || '').trim(),
      exercises: a.exercises.map(e => ({
        exId: e.exId, notes: (e.notes || '').trim(), target: e.target, rest: e.rest,
        sets: e.sets.filter(x => x.done).map(x => ({ w: x.w || 0, r: x.r, done: true, warmup: !!x.warmup }))
      })).filter(e => e.sets.length),
      updatedAt: Date.now()
    };
    s.volume = GL.sessionVolume(s);
    S.sessions = S.sessions.filter(x => x.id !== s.id);
    S.sessions.push(s);
    invalidate();
    await save.session(s);
    for (const e of s.exercises) {
      const ex = exById(e.exId);
      const sg = GL.suggestNext(ex, Object.assign({}, e.target, { sets: e.sets.filter(x => !x.warmup).length }), history(e.exId), U());
      if (sg) S.suggestions[e.exId] = Object.assign(sg, { status: 'pending', sessionId: s.id, created: Date.now() });
      else delete S.suggestions[e.exId];
    }
    await save.suggestions();
    S.active = null;
    saveActive(true);
    releaseWakeLock();
    haptic(true);
    S.ui.wkOpen = false;
    $('#workout').classList.add('away');
    $('#workout').setAttribute('aria-hidden', 'true');
    $('#rest').classList.add('off');
    push('summary', { id: s.id });
  } finally { finishing = false; }
}
async function discardWorkout(skipConfirm) {
  if (!skipConfirm) {
    const ok = await confirmDialog('Discard this workout?', 'Sets you logged in this workout will be deleted.', 'Discard workout', true);
    if (!ok) return;
  }
  S.active = null; saveActive(true); releaseWakeLock();
  S.ui.wkOpen = false;
  $('#workout').classList.add('away'); $('#rest').classList.add('off');
  render();
}

// ---------- wake lock ----------
async function requestWakeLock() {
  if (!S.settings.wakeLock || !S.active || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
  try { if (!wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
}
function releaseWakeLock() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }

// ---------- resume bar & clock ----------
function updateResume() {
  const el = $('#resume');
  const show = S.active && !S.ui.wkOpen && S.settings.onboarded;
  el.classList.toggle('hidden', !show);
  if (show) {
    $('#resume-name').textContent = S.active.name;
    const rest = S.active.restEnd ? ` · Rest ${fmtDur(Math.max(0, S.active.restEnd - Date.now()) + 999)}` : '';
    $('#resume-time').textContent = fmtDur(Date.now() - S.active.start) + rest;
  }
}
function tick() {
  if (!S.active) return;
  const t = fmtDur(Date.now() - S.active.start);
  const e1 = $('#wk-elapsed'); if (e1) e1.textContent = t;
  $('#wk-sub').textContent = t;
  updateRest();
  updateResume();
}

async function customExerciseForm(existing) {
  const e = existing || {};
  const opts = (list, sel) => list.map(([k, l]) => `<option value="${k}" ${sel === k ? 'selected' : ''}>${esc(l)}</option>`).join('');
  const res = await formSheet(existing ? 'Edit exercise' : 'New exercise', `
    <label class="field"><span>Name</span><input name="name" data-autofocus value="${esc(e.name || '')}" placeholder="e.g. Landmine Press" autocomplete="off"></label>
    <label class="field"><span>Target muscle</span><select name="muscle">${opts(GL.MUSCLES, e.muscle || 'chest')}</select></label>

    existing ? 'Save' : 'Create exercise', f => {

function remapSchedule(plan, fn) { plan.schedule = plan.schedule.map(x => x == null ? null : fn(x)); }

function applySuggestionToPlan(exId, weight) {
  const sg = S.suggestions[exId];
  sg.prevTargets = [];
  const p = activePlan(); if (!p) return;
  for (const d of p.days) d.exercises.forEach((e, i) => {
    if (e.exId === exId) { sg.prevTargets.push({ planId: p.id, dayId: d.id, i, weight: e.weight }); e.weight = weight; }
  });
  if (sg.prevTargets.length) save.plan(p);
}

function backupObject() {
  return { app: 'ironlog', version: 1, exportedAt: new Date().toISOString(), settings: S.settings, plans: S.plans, sessions: S.sessions, body: S.body, custom: S.custom, suggestions: S.suggestions };
}
async function doRestore(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('That file isn\'t a valid backup'); return; }
  if (!data || data.app !== 'ironlog' || !Array.isArray(data.sessions)) { toast('That file isn\'t an Ironlog backup'); return; }
  let mode = 'merge';
  const hasData = S.sessions.length || S.body.length;
  if (hasData) {
    mode = await actionSheet(`Backup from ${new Date(data.exportedAt).toLocaleDateString()} · ${data.sessions.length} workouts`, [
      { label: 'Merge with this iPhone\'s data', value: 'merge' },
      { label: 'Replace everything on this iPhone', value: 'replace', danger: true }
    ]);
    if (!mode) return;
  }
  const stamp = x => x.updatedAt || x.end || x.date || x.created || 0;
  const merge = (cur, inc) => {
    const m = new Map(cur.map(x => [x.id, x]));
    for (const x of inc || []) { const c = m.get(x.id); if (!c || stamp(x) >= stamp(c)) m.set(x.id, x); }
    return [...m.values()];
  };
  if (mode === 'replace') {
    for (const st of ['sessions', 'plans', 'body', 'custom']) await DB.clear(st);
    S.sessions = data.sessions; S.plans = data.plans || []; S.body = data.body || []; S.custom = data.custom || [];
    S.suggestions = data.suggestions || {};
    S.settings = Object.assign({}, DEFAULT_SETTINGS, data.settings || {});
  } else {
    S.sessions = merge(S.sessions, data.sessions); S.plans = merge(S.plans, data.plans);
    S.body = merge(S.body, data.body); S.custom = merge(S.custom, data.custom);
    S.suggestions = Object.assign({}, data.suggestions || {}, S.suggestions);
    if (!S.settings.onboarded && data.settings) S.settings = Object.assign({}, DEFAULT_SETTINGS, data.settings);
  }
  S.settings.onboarded = true;
  if (!S.plans.find(p => p.id === S.settings.activePlanId)) S.settings.activePlanId = S.plans[0] ? S.plans[0].id : null;
  S.body.sort((a, b) => a.date - b.date);
  await Promise.all([DB.putMany('sessions', S.sessions), DB.putMany('plans', S.plans), DB.putMany('body', S.body), DB.putMany('custom', S.custom), save.settings(), save.suggestions()]);
  resetExCache(); invalidate(); applyTheme();
  S.ui.tab = 'home'; for (const k in S.ui.stacks) S.ui.stacks[k] = [];
  render();
  toast(`Restored · ${S.sessions.length} workouts`);
}

function csvExport() {
  const u = U();
  const q = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = [['Date', 'Time', 'Workout', 'Exercise', 'Muscle', 'Equipment', 'Set', 'Warm-up', `Weight (${u})`, 'Reps', `Est. 1RM (${u})`, `Volume (${u})`, 'Exercise notes', 'Workout notes']];
  for (const s of finishedSessions()) for (const ex of s.exercises) {
    const e = exById(ex.exId);
    ex.sets.filter(x => x.done).forEach((st, i) => rows.push([GL.dayKey(s.start), fmtTime(s.start), s.name, e.name, GL.MUSCLE_NAME[e.muscle], GL.EQUIPMENT_NAME[e.equipment], i + 1, st.warmup ? 'yes' : '',
      GL.fmtW(st.w, u), st.r, st.w ? GL.fmtW(GL.e1rm(st.w, st.r), u) : '', GL.round(GL.toDisplay(st.w * st.r, u), 1), ex.notes || '', i === 0 ? s.notes || '' : '']));
  }
  return rows.map(r => r.map(q).join(',')).join('\n');
}

    else if (c === 'rest') {
      const r = await actionSheet('Rest between sets', REST_OPTS.map(x => ({ label: restLabel(x) + (x === wex.rest ? ' ✓' : ''), value: x })));
      if (r) { wex.rest = r; if (a.restEnd) { a.restEnd = a.restEnd - a.restTotal * 1000 + r * 1000; a.restTotal = r; } }
    } else if (c === 'replace') {
      if (wex.sets.some(x => x.done) && !await confirmDialog('Replace exercise?', 'Completed sets for this exercise will be cleared.', 'Replace')) return;
      minimizeWorkout(); push('pick', { mode: 'replace', e: i, selected: [] });
      return;
    } else if (c === 'up' || c === 'down') {
      const j = c === 'up' ? i - 1 : i + 1;
      [a.exercises[i], a.exercises[j]] = [a.exercises[j], a.exercises[i]];
    } else if (c === 'remove') {
      if (wex.sets.some(x => x.done) && !await confirmDialog('Remove exercise?', 'Its completed sets will be removed from this workout.', 'Remove', true)) return;
      a.exercises.splice(i, 1);
    } else return;
    saveActive(true); renderWorkout();
  },
  wkAddEx() { minimizeWorkout(); push('pick', { mode: 'workout', selected: [] }); },
  restAdj(d) { const a = S.active; if (!a.restEnd) return; a.restEnd += +d.d * 1000; a.restTotal = Math.max(1, a.restTotal + +d.d); if (a.restEnd <= Date.now()) a.restEnd = Date.now() + 1000; saveActive(); updateRest(); },
  restSkip() { S.active.restEnd = null; restOverUntil = 0; saveActive(); updateRest(); }
};

const IN = {
  libSearch(el) { S.ui.libQ = el.value; applyLibSearch(); },
  planName(el) { const p = S.plans.find(x => x.id === el.dataset.plan); p.name = el.value.trim() || 'My plan'; savePlanSoon(p); },
  sched(el) { const p = S.plans.find(x => x.id === el.dataset.plan); p.schedule[+el.dataset.i] = el.value === '' ? null : +el.value; save.plan(p); },
  dayName(el) { const d = curDay(); d.name = el.value.trim() || 'Workout'; savePlanSoon(curPlan()); const t = $('.navbar .t'); if (t) t.textContent = d.name; },
  dex(el) {
    const e = curDay().exercises[+el.dataset.i]; const f = el.dataset.f; const v = el.value.trim();
    if (f === 'weight') e.weight = v === '' ? null : GL.fromDisplay(v.replace(',', '.'), U());
    else if (f === 'rest') e.rest = +v;
    else { const n = parseInt(v, 10); if (!isNaN(n) && n > 0) e[f] = Math.min(100, n); }
    if (e.repMin > e.repMax && f !== 'weight' && f !== 'rest') { if (f === 'repMin') e.repMax = e.repMin; else e.repMin = e.repMax; }
    savePlanSoon(curPlan());
  },
  sessName(el) { cv().draft.name = el.value; },
  sessNotes(el) { cv().draft.notes = el.value; },
  sessDur(el) { const n = parseInt(el.value, 10); if (n > 0 && n < 1000) { const d = cv().draft; d.end = d.start + n * 60000; } },
  sessSet(el) {
    const st = cv().draft.exercises[+el.dataset.e].sets[+el.dataset.s]; const v = el.value.trim().replace(',', '.');
    if (el.dataset.f === 'w') st.w = v === '' ? null : GL.fromDisplay(v, U());
    else st.r = v === '' ? null : parseInt(v, 10) || null;
  },
  bodyF(el) {
    const d = cv().draft; const f = el.dataset.f; const v = el.value.trim().replace(',', '.');
    if (f === 'date') { if (v) { const [y, m, dd] = v.split('-').map(Number); d.date = new Date(y, m - 1, dd, 12).getTime(); } return; }
    if (f === 'notes') { d.notes = el.value; return; }
    if (v === '' || isNaN(+v)) { d[f] = null; return; }
    const kind = BODY_METRICS.find(m => m[0] === f)[2];
    d[f] = kind === 'w' ? GL.fromDisplay(v, U()) : kind === 'len' && S.settings.lenUnit === 'in' ? +v * CM_PER_IN : +v;
  },
  async bodyPhoto(el) {
    const file = el.files && el.files[0]; if (!file) return;
    try { cv().draft.photo = await compressImage(file, 1080, 0.82); render(); }
    catch (e) { toast('Couldn\'t read that photo'); }
  },
  cmp(el) { cv()[el.dataset.k] = el.value; render(); },
  async toggle(el) { S.settings[el.dataset.k] = el.checked; await save.settings(); if (el.dataset.k === 'wakeLock') { if (el.checked) requestWakeLock(); else releaseWakeLock(); } },
  async defaultRest(el) { S.settings.defaultRest = +el.value; await save.settings(); },
  async restore(el) { const f = el.files && el.files[0]; el.value = ''; if (f) await doRestore(f); },
  // live workout
  wi(el) {
    const s = S.active.exercises[+el.dataset.e].sets[+el.dataset.s];
    const v = el.value.trim().replace(',', '.');
    if (el.dataset.f === 'w') s.w = v === '' || isNaN(+v) ? null : GL.fromDisplay(v, U());
    else { const n = parseInt(v, 10); s.r = isNaN(n) ? null : n; }
    saveActive();
  },
  exNote(el) { S.active.exercises[+el.dataset.e].notes = el.value; saveActive(); },
  wkNote(el) { S.active.notes = el.value; saveActive(); }
};

function compressImage(file, max, q) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}

// ---------- event wiring ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.closest('.sheet') || el.disabled) return;
  const fn = ACT[el.dataset.a];
  if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});
function onInput(e) {
  const el = e.target.closest('[data-in]');
  if (!el || el.closest('.sheet')) return;
  const isChange = el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'file' || el.type === 'date';
  if ((e.type === 'change') !== isChange) return;
  const fn = IN[el.dataset.in]; if (fn) fn(el, e);
}
document.addEventListener('input', onInput);
document.addEventListener('change', onInput);
// select-all on focus makes overwriting a number one tap
document.addEventListener('focusin', e => {
  const el = e.target;
  if (el.matches && el.matches('.sets input, .pe-ex input')) setTimeout(() => { try { el.select(); } catch (x) {} }, 0);
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { if (S.active) saveActive(true); }
  else { requestWakeLock(); tick(); }
});
window.addEventListener('pagehide', () => { if (S.active) saveActive(true); });

async function boot() {
  await loadAll();
  applyTheme();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {}
  render();
  if (S.active) openWorkout();
  setInterval(tick, 250);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
boot();

})();
</script>
