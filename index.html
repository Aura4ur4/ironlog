<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ironlog</title>
<meta name="description" content="Gym workout tracker: log sets, track strength progress and body measurements.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ironlog">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root {
  --bg: #F2F2F7; --surface: #FFFFFF; --surface2: #E8E8ED; --fill: rgba(118,118,128,.12);
  --line: rgba(60,60,67,.18); --text: #000000; --text2: #6C6C70; --text3: #AEAEB2;
  --accent: #1F6FEB; --accent-ink: #FFFFFF; --accent-soft: rgba(31,111,235,.12);
  --done: #22A447; --done-soft: rgba(34,164,71,.12);
  --pr: #B98000; --pr-soft: rgba(230,170,20,.16);
  --danger: #E5383B; --warm: #E07A00;
  --bar: rgba(249,249,251,.86); --shadow: 0 1px 2px rgba(0,0,0,.06);
  --r-lg: 14px; --r-md: 10px; --r-sm: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1C1C1E; --surface2: #2C2C2E; --fill: rgba(118,118,128,.24);
    --line: rgba(84,84,88,.55); --text: #FFFFFF; --text2: #98989F; --text3: #5A5A5E;
    --accent: #4C8DFF; --accent-ink: #FFFFFF; --accent-soft: rgba(76,141,255,.18);
    --done: #30D158; --done-soft: rgba(48,209,88,.16);
    --pr: #FFC53D; --pr-soft: rgba(255,197,61,.15);
    --danger: #FF453A; --warm: #FF9F0A;
    --bar: rgba(22,22,24,.86); --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1C1C1E; --surface2: #2C2C2E; --fill: rgba(118,118,128,.24);
  --line: rgba(84,84,88,.55); --text: #FFFFFF; --text2: #98989F; --text3: #5A5A5E;
  --accent: #4C8DFF; --accent-ink: #FFFFFF; --accent-soft: rgba(76,141,255,.18);
  --done: #30D158; --done-soft: rgba(48,209,88,.16);
  --pr: #FFC53D; --pr-soft: rgba(255,197,61,.15);
  --danger: #FF453A; --warm: #FF9F0A;
  --bar: rgba(22,22,24,.86); --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); }
body {
  font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  color: var(--text); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none; touch-action: manipulation;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font-size: 17px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

/* ---------- layout ---------- */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
#main {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 0 16px calc(96px + env(safe-area-inset-bottom));
}
.page { max-width: 640px; margin: 0 auto; }
.large-title { padding-top: calc(env(safe-area-inset-top) + 12px); }
.large-title h1 { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: .3px; margin: 8px 0 2px; }
.large-title .sub { color: var(--text2); font-size: 15px; margin-bottom: 14px; }

.navbar {
  position: sticky; top: 0; z-index: 5; margin: 0 -16px 8px;
  padding: calc(env(safe-area-inset-top) + 6px) 8px 8px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid var(--line);
}
.navbar .t { font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 56vw; }
.navbar .l { justify-self: start; } .navbar .r { justify-self: end; }
.navbtn { color: var(--accent); font-size: 17px; padding: 8px; min-height: 44px; display: inline-flex; align-items: center; gap: 2px; }
.navbtn.strong { font-weight: 600; }
.navbtn svg { width: 22px; height: 22px; }

/* tab bar */
#tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 6px 4px calc(env(safe-area-inset-bottom) + 4px);
  background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: .5px solid var(--line);
}
#tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 500; color: var(--text2); padding: 4px 0; min-height: 48px; }
#tabbar button svg { width: 26px; height: 26px; }
#tabbar button[aria-current="page"] { color: var(--accent); }

/* resume bar */
#resume {
  position: fixed; left: 12px; right: 12px; z-index: 19;
  bottom: calc(env(safe-area-inset-bottom) + 66px);
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  border-radius: var(--r-lg); background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: 616px; margin: 0 auto;
}
#resume .grow { flex: 1; min-width: 0; text-align: left; }
#resume b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#resume span { font-size: 13px; opacity: .85; }

/* ---------- groups / lists ---------- */
.section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 4px 8px; }
.section-h h2 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: .2px; }
.section-h h3 { font-size: 13px; font-weight: 400; margin: 0; color: var(--text2); }
.section-h .link { color: var(--accent); font-size: 15px; }
.group-label { font-size: 13px; color: var(--text2); margin: 22px 16px 6px; }
.group-foot { font-size: 13px; color: var(--text2); margin: 6px 16px 0; }
.group { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow); }
.row {
  display: flex; align-items: center; gap: 12px; padding: 11px 16px; min-height: 48px; width: 100%; text-align: left;
  position: relative;
}
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--line); }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { font-size: 14px; color: var(--text2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .val { color: var(--text2); font-size: 16px; white-space: nowrap; }
.row .chev { color: var(--text3); width: 14px; height: 14px; flex: none; }
.row.danger .title { color: var(--danger); }
.row.accent .title { color: var(--accent); }
.row select, .row input.inline {
  border: 0; background: transparent; color: var(--text2); text-align: right; font-size: 16px; max-width: 55%;
  -webkit-appearance: none; appearance: none; padding: 4px 0;
}
.row input.inline:focus { color: var(--text); outline: none; }
.icon-dot { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; font-size: 13px; font-weight: 700; }
.icon-dot svg { width: 18px; height: 18px; }

.empty { text-align: center; color: var(--text2); padding: 36px 20px; }
.empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
.empty .btn { margin-top: 16px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 20px; border-radius: var(--r-lg);
  background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 17px;
}
.btn.block { width: 100%; }
.btn.secondary { background: var(--fill); color: var(--accent); }
.btn.plain { background: transparent; color: var(--accent); }
.btn.danger { background: transparent; color: var(--danger); }
.btn.done { background: var(--done); }
.btn:active { opacity: .7; }
.btn svg { width: 20px; height: 20px; }
.btn-row { display: flex; gap: 10px; }
.btn-row > * { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 4px; padding: 7px 13px; border-radius: 999px;
  background: var(--fill); font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--text);
}
.pill[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px; margin: 0 -16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; margin: 4px 0 6px; }
.seg button { padding: 7px 4px; font-size: 14px; font-weight: 500; border-radius: 7px; color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: #636366; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: #636366; } }

.search {
  display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: var(--r-md); padding: 0 10px; height: 38px; margin-bottom: 10px;
}
.search svg { width: 16px; height: 16px; color: var(--text2); flex: none; }
.search input { flex: 1; border: 0; background: transparent; outline: none; min-width: 0; }

/* ---------- home ---------- */
.today {
  background: var(--surface); border-radius: 20px; padding: 18px 18px 16px; box-shadow: var(--shadow);
}
.today .kicker { font-size: 15px; color: var(--text2); }
.today h2 { font-size: 28px; line-height: 1.15; font-weight: 700; margin: 2px 0 10px; letter-spacing: .2px; }
.today ul { list-style: none; margin: 0 0 16px; padding: 0; }
.today li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: .5px solid var(--line); font-size: 15px; }
.today li span:last-child { color: var(--text2); white-space: nowrap; }
.today .donebadge { display: inline-flex; align-items: center; gap: 6px; color: var(--done); font-weight: 600; font-size: 15px; margin-bottom: 12px; }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: var(--surface); border-radius: var(--r-lg); padding: 12px 6px; box-shadow: var(--shadow); }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); min-width: 0; }
.wd .dn { font-weight: 600; }
.wd .c { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--text2); background: var(--fill); }
.wd .c svg { width: 16px; height: 16px; }
.wd.done .c { background: var(--done); color: #fff; }
.wd.missed .c { background: transparent; border: 1.5px dashed var(--text3); color: var(--text3); }
.wd.is-today .c { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.wd.rest .c { background: transparent; color: var(--text3); }
.wd .lab { font-size: 10.5px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border-radius: var(--r-lg); padding: 13px 14px; box-shadow: var(--shadow); min-width: 0; }
.stat .k { font-size: 13px; color: var(--text2); }
.stat .v { font-size: 26px; font-weight: 700; margin-top: 2px; letter-spacing: .2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .v small { font-size: 15px; font-weight: 600; color: var(--text2); margin-left: 3px; }
.stat .d { font-size: 13px; margin-top: 2px; color: var(--text2); }
.up { color: var(--done) !important; } .down { color: var(--danger) !important; }

.ring { --p: 0; width: 64px; height: 64px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }

.pr-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--pr-soft); color: var(--pr); white-space: nowrap; }
.pr-badge svg { width: 12px; height: 12px; }

.notice { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border-radius: var(--r-lg); padding: 14px; margin-top: 14px; font-size: 15px; box-shadow: var(--shadow); }
.notice .grow { flex: 1; }
.notice b { display: block; margin-bottom: 2px; }
.notice p { margin: 0 0 8px; color: var(--text2); }

/* ---------- active workout ---------- */
#workout {
  position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column;
  transform: translateY(0); transition: transform .32s cubic-bezier(.2,.8,.2,1);
}
#workout.away { transform: translateY(105%); pointer-events: none; }
#wk-head {
  padding: calc(env(safe-area-inset-top) + 4px) 8px 8px; display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center;
  background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid var(--line);
}
#wk-head .mid { text-align: center; min-width: 0; }
#wk-head .mid b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#wk-head .mid span { font-size: 13px; color: var(--text2); font-variant-numeric: tabular-nums; }
#wk-head .finish { background: var(--done); color: #fff; font-weight: 600; padding: 0 16px; min-height: 36px; border-radius: 999px; font-size: 15px; }
#wk-body { flex: 1; overflow-y: auto; padding: 12px 12px calc(env(safe-area-inset-bottom) + 140px); }
#wk-body .inner { max-width: 640px; margin: 0 auto; }
.wk-clock { display: flex; justify-content: center; gap: 22px; margin: 4px 0 14px; font-size: 13px; color: var(--text2); text-align: center; }
.wk-clock b { display: block; color: var(--text); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

.exc { background: var(--surface); border-radius: 16px; margin-bottom: 12px; overflow: hidden; box-shadow: var(--shadow); }
.exc-h { display: flex; align-items: flex-start; gap: 8px; padding: 14px 8px 4px 16px; }
.exc-h .grow { flex: 1; min-width: 0; }
.exc-h .name { font-size: 19px; font-weight: 700; color: var(--accent); text-align: left; line-height: 1.2; }
.exc-h .meta { font-size: 13px; color: var(--text2); margin-top: 3px; }
.exc-h .more { width: 44px; height: 36px; display: grid; place-items: center; color: var(--accent); flex: none; }
.exc-h .more svg { width: 22px; height: 22px; }
.exc .prev { font-size: 13px; color: var(--text2); padding: 0 16px 8px; }
.exc .note-in {
  display: block; width: calc(100% - 24px); margin: 2px 12px 10px; border: 0; border-radius: var(--r-sm);
  background: var(--fill); padding: 8px 10px; font-size: 15px; resize: none; min-height: 38px;
}
.sug { margin: 4px 12px 10px; border-radius: 12px; padding: 11px 12px; background: var(--accent-soft); font-size: 14px; }
.sug.up { color: inherit !important; }
.sug .what { font-weight: 700; font-size: 15px; color: var(--accent); margin-bottom: 2px; }
.sug .why { color: var(--text2); margin-bottom: 9px; }
.sug .btn-row .btn { min-height: 36px; font-size: 14px; padding: 0 8px; border-radius: 9px; }
.sug.accepted { background: var(--done-soft); }
.sug.accepted .what { color: var(--done); }

.sets { width: 100%; border-collapse: collapse; }
.sets th { font-size: 12px; font-weight: 600; color: var(--text2); padding: 4px 4px 6px; text-align: center; }
.sets th:first-child { width: 44px; }
.sets th.prevh { text-align: left; }
.sets th:last-child { width: 58px; }
.sets td { padding: 3px 4px; text-align: center; }
.sets tr.done td { background: var(--done-soft); }
.sets .setno { width: 34px; height: 34px; border-radius: 9px; font-weight: 700; font-size: 15px; color: var(--text2); background: var(--fill); margin: 0 auto; display: grid; place-items: center; }
.sets .setno.w { color: var(--warm); }
.sets .pv { font-size: 13px; color: var(--text2); text-align: left; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sets input {
  width: 100%; max-width: 86px; height: 42px; border: 0; border-radius: 10px; background: var(--fill);
  text-align: center; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; outline: none;
}
.sets input::placeholder { color: var(--text3); font-weight: 500; }
.sets input:focus { box-shadow: inset 0 0 0 2px var(--accent); }
.sets tr.done input { background: transparent; }
.chk {
  width: 46px; height: 42px; border-radius: 12px; background: var(--fill); display: grid; place-items: center;
  color: var(--text3); margin: 0 auto; transition: background .15s;
}
.chk svg { width: 22px; height: 22px; }
tr.done .chk { background: var(--done); color: #fff; animation: clunk .28s ease-out; }
@keyframes clunk { 0% { transform: scale(.82); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
.addset { display: flex; align-items: center; justify-content: center; gap: 6px; width: calc(100% - 24px); margin: 8px 12px 12px; min-height: 40px; border-radius: 10px; background: var(--fill); font-weight: 600; font-size: 15px; color: var(--text); }
.addset svg { width: 18px; height: 18px; }

#rest {
  position: fixed; left: 10px; right: 10px; z-index: 45; bottom: calc(env(safe-area-inset-bottom) + 10px);
  max-width: 620px; margin: 0 auto; background: var(--surface2); border-radius: 20px; padding: 12px 14px 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,.3); transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .2s;
}
#rest.off { transform: translateY(140%); opacity: 0; pointer-events: none; }
#rest .track { height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; margin-bottom: 10px; }
#rest .track i { display: block; height: 100%; background: var(--accent); width: 100%; transform-origin: left; }
#rest .rrow { display: flex; align-items: center; gap: 8px; }
#rest .time { flex: 1; font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .5px; }
#rest .time small { display: block; font-size: 12px; font-weight: 500; color: var(--text2); letter-spacing: 0; }
#rest .rb { min-width: 54px; height: 44px; border-radius: 12px; background: var(--fill); font-weight: 600; font-size: 15px; }
#rest .rb.skip { background: var(--accent); color: var(--accent-ink); min-width: 70px; }
#rest.over { background: var(--done); color: #fff; }
#rest.over .time small { color: rgba(255,255,255,.85); }

/* ---------- sheets / dialogs ---------- */
#scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.4); opacity: 0; transition: opacity .2s; }
#scrim.on { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-height: 92vh; overflow-y: auto;
  background: var(--bg); border-radius: 14px 14px 0 0; padding: 8px 16px calc(env(safe-area-inset-bottom) + 16px);
  transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); max-width: 640px; margin: 0 auto;
}
.sheet.on { transform: translateY(0); }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--text3); margin: 0 auto 10px; }
.sheet h3 { font-size: 20px; margin: 4px 4px 4px; }
.sheet p.msg { color: var(--text2); font-size: 15px; margin: 2px 4px 14px; }
.sheet .acts { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.actsheet .opt { background: var(--surface); width: 100%; min-height: 54px; font-size: 18px; color: var(--accent); }
.actsheet .opts { border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; gap: .5px; background: var(--line); }
.actsheet .opt.danger { color: var(--danger); }
.actsheet .cancel { margin-top: 8px; background: var(--surface); border-radius: var(--r-lg); width: 100%; min-height: 54px; font-size: 18px; font-weight: 600; color: var(--accent); }
.actsheet .head { text-align: center; color: var(--text2); font-size: 13px; padding: 12px 16px; background: var(--surface); }

.field { display: block; background: var(--surface); border-radius: var(--r-md); padding: 8px 14px; margin-bottom: 10px; }
.field span { display: block; font-size: 12px; color: var(--text2); }
.field input, .field select, .field textarea { width: 100%; border: 0; background: transparent; outline: none; padding: 4px 0 2px; font-size: 17px; -webkit-appearance: none; appearance: none; }
.field textarea { resize: vertical; min-height: 60px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 .field { margin-bottom: 0; }
.formgap { height: 10px; }

#toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 10px); z-index: 80;
  transform: translate(-50%, -150%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px;
  font-size: 15px; font-weight: 600; transition: transform .3s cubic-bezier(.2,.8,.2,1); max-width: 90vw; text-align: center;
}
#toast.on { transform: translate(-50%, 0); }

/* ---------- plan editor ---------- */
.stepper { display: inline-flex; align-items: center; background: var(--fill); border-radius: 9px; }
.stepper button { width: 34px; height: 32px; font-size: 20px; font-weight: 500; color: var(--accent); }
.stepper b { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.pe-ex { background: var(--surface); border-radius: var(--r-lg); padding: 12px 12px 12px 16px; margin-bottom: 10px; box-shadow: var(--shadow); }
.pe-ex .top { display: flex; align-items: center; gap: 6px; }
.pe-ex .top .grow { flex: 1; min-width: 0; font-weight: 600; }
.pe-ex .top .meta { font-size: 13px; color: var(--text2); font-weight: 400; }
.pe-ex .ib { width: 34px; height: 34px; display: grid; place-items: center; color: var(--text2); border-radius: 8px; }
.pe-ex .ib svg { width: 18px; height: 18px; }
.pe-ex .ib:disabled { opacity: .3; }
.pe-ex .ctrls { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 8px; margin-top: 10px; align-items: end; }
.pe-ex .ctrls label { font-size: 12px; color: var(--text2); display: flex; flex-direction: column; gap: 4px; }
.pe-ex .ctrls input, .pe-ex .ctrls select {
  height: 32px; border: 0; border-radius: 8px; background: var(--fill); text-align: center; font-size: 16px; width: 56px; padding: 0 4px; -webkit-appearance: none; appearance: none;
}
.pe-ex .rr { display: flex; align-items: center; gap: 3px; }
.pe-ex .rr input { width: 40px; }

/* ---------- charts ---------- */
.chart-card { background: var(--surface); border-radius: var(--r-lg); padding: 14px 12px 8px; box-shadow: var(--shadow); }
.chart-card .ch-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 6px; }
.chart-card .ch-head b { font-size: 26px; font-variant-numeric: tabular-nums; }
.chart-card .ch-head span { font-size: 13px; color: var(--text2); }
.chart { width: 100%; height: 190px; position: relative; touch-action: pan-y; }
.chart.short { height: 150px; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .tip { position: absolute; top: -6px; transform: translateX(-50%); background: var(--text); color: var(--bg); font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
.axis { fill: var(--text2); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.gridline { stroke: var(--line); stroke-width: .5; }
.hbar { display: grid; grid-template-columns: 96px 1fr 40px; align-items: center; gap: 8px; padding: 5px 0; font-size: 14px; }
.hbar .tr { height: 10px; border-radius: 5px; background: var(--fill); overflow: hidden; }
.hbar .tr i { display: block; height: 100%; border-radius: 5px; background: var(--accent); }
.hbar .n { text-align: right; color: var(--text2); font-variant-numeric: tabular-nums; }
.hbar .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spark { width: 64px; height: 26px; flex: none; }

/* ---------- body ---------- */
.photo-thumb { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; flex: none; background: var(--fill); }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.compare figure { margin: 0; }
.compare img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 12px; background: var(--fill); display: block; }
.compare figcaption { font-size: 13px; color: var(--text2); text-align: center; margin-top: 6px; }
.photo-pick img { width: 100%; max-height: 260px; object-fit: contain; border-radius: 12px; display: block; margin: 6px 0; }

/* ---------- onboarding ---------- */
.onb { padding-top: calc(env(safe-area-inset-top) + 28px); }
.onb h1 { font-size: 34px; margin: 0 0 6px; }
.onb p.lead { color: var(--text2); margin: 0 0 22px; }
.tpl { display: block; width: 100%; text-align: left; background: var(--surface); border-radius: var(--r-lg); padding: 14px 16px; margin-bottom: 10px; border: 2px solid transparent; box-shadow: var(--shadow); }
.tpl b { display: block; font-size: 17px; }
.tpl span { font-size: 14px; color: var(--text2); }
.tpl[aria-pressed="true"] { border-color: var(--accent); }

.lib-letter { font-size: 13px; color: var(--text2); font-weight: 600; margin: 18px 16px 6px; }
.check-c { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--text3); flex: none; display: grid; place-items: center; }
.check-c svg { width: 14px; height: 14px; color: #fff; display: none; }
.sel .check-c { background: var(--accent); border-color: var(--accent); }
.sel .check-c svg { display: block; }
.pick-bar { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px); z-index: 30; max-width: 616px; margin: 0 auto; }

.sum-hero { text-align: center; padding: 18px 0 8px; }
.sum-hero .medal { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 10px; background: var(--done); color: #fff; }
.sum-hero .medal svg { width: 34px; height: 34px; }
.sum-hero h1 { font-size: 28px; margin: 0; }
.sum-hero p { color: var(--text2); margin: 4px 0 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
@media (min-width: 700px) { #main { padding-left: 24px; padding-right: 24px; } }

.edit-set { display: grid; grid-template-columns: 26px 1fr auto 1fr auto 40px; align-items: center; gap: 6px; padding: 8px 8px 8px 14px; }
.edit-set input { min-width: 0; width: 100%; height: 38px; border: 0; border-radius: 8px; background: var(--fill); padding: 0 10px; font-size: 17px; font-variant-numeric: tabular-nums; }
.edit-set .u { color: var(--text2); font-size: 14px; }
.edit-set .no { color: var(--text2); font-weight: 700; text-align: center; }

</style>
</head>
<body>
<div id="app">
  <main id="main" aria-live="polite"></main>
  <button id="resume" class="hidden" data-a="openWorkout" aria-label="Resume workout">
    <span class="grow"><b id="resume-name"></b><span id="resume-time" class="num"></span></span>
    <span style="font-weight:600">Resume</span>
  </button>
  <nav id="tabbar" aria-label="Main">
    <button data-a="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg><span>Home</span></button>
    <button data-a="tab" data-tab="workouts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></svg><span>Workouts</span></button>
    <button data-a="tab" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Progress</span></button>
    <button data-a="tab" data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Profile</span></button>
  </nav>
</div>
<section id="workout" class="away" aria-hidden="true" aria-label="Active workout">
  <header id="wk-head">
    <button class="navbtn" data-a="wkMin" aria-label="Minimize workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="mid" data-a="wkRename" aria-label="Rename workout"><b id="wk-title">Workout</b><span id="wk-sub">0:00</span></button>
    <button class="finish" data-a="wkFinish">Finish</button>
  </header>
  <div id="wk-body"><div class="inner" id="wk-inner"></div></div>
  <div id="rest" class="off" role="timer" aria-live="off">
    <div class="track"><i id="rest-bar"></i></div>
    <div class="rrow">
      <div class="time" id="rest-time">0:00<small id="rest-label">Rest</small></div>
      <button class="rb" data-a="restAdj" data-d="-15" aria-label="15 seconds less">−15</button>
      <button class="rb" data-a="restAdj" data-d="15" aria-label="15 seconds more">+15</button>
      <button class="rb skip" data-a="restSkip">Skip</button>
    </div>
  </div>
</section>
<div id="toast" role="status"></div>

  // ---------- helpers ----------
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  const KG_PER_LB = 0.45359237;
  function toDisplay(kg, unit) {
    if (kg == null || kg === '') return '';
    const v = unit === 'lb' ? kg / KG_PER_LB : kg;
    return round(v, unit === 'lb' ? 1 : 2);
  }
  function fromDisplay(v, unit) {
    if (v == null || v === '' || isNaN(+v)) return null;
    return unit === 'lb' ? +v * KG_PER_LB : +v;
  }
  function round(v, dp) {
    const p = Math.pow(10, dp);
    return Math.round(v * p) / p;

  function fmtW(kg, unit) {
    if (kg == null) return '–';

/* Storage: IndexedDB with one store per record type, plus a key/value store.
   The in-progress workout is also mirrored to localStorage synchronously so a
   force-quit between debounced writes can't lose a set. */
(function (root) {
  'use strict';
  const NAME = 'ironlog', VERSION = 1;
  const STORES = ['sessions', 'plans', 'body', 'custom', 'kv'];
  let dbp = null;
  let memory = null; // fallback if IndexedDB is unavailable

  function open() {
    if (dbp) return dbp;
    dbp = new Promise((resolve) => {
      let req;
      try { req = indexedDB.open(NAME, VERSION); } catch (e) { memory = mem(); return resolve(null); }
      req.onupgradeneeded = () => {
        const db = req.result;
        for (const s of STORES) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, s === 'kv' ? undefined : { keyPath: 'id' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => { memory = mem(); resolve(null); };
      req.onblocked = () => {};
    });
    return dbp;
  }
  function mem() { const m = {}; for (const s of STORES) m[s] = new Map(); return m; }

  function tx(store, mode, fn) {
    return open().then(db => new Promise((resolve, reject) => {
      if (!db) { resolve(fn(null)); return; }
      const t = db.transaction(store, mode);
      const os = t.objectStore(store);
      let result;
      Promise.resolve(fn(os)).then(r => { result = r; });
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    }));

    all(store) {
      return tx(store, 'readonly', os => os ? reqP(os.getAll()) : Array.from(memory[store].values()));
    },
    put(store, value) {
      return tx(store, 'readwrite', os => { if (os) os.put(value); else memory[store].set(value.id, value); });
    },
    putMany(store, values) {
      return tx(store, 'readwrite', os => { for (const v of values) { if (os) os.put(v); else memory[store].set(v.id, v); } });
    },
    del(store, id) {
      return tx(store, 'readwrite', os => { if (os) os.delete(id); else memory[store].delete(id); });
    },
    clear(store) {
      return tx(store, 'readwrite', os => { if (os) os.clear(); else memory[store].clear(); });
    },
    get(key) {
      return tx('kv', 'readonly', os => os ? reqP(os.get(key)) : memory.kv.get(key));
    },
    set(key, value) {
      return tx('kv', 'readwrite', os => { if (os) os.put(value, key); else memory.kv.set(key, value); });
    },
    remove(key) {
      return tx('kv', 'readwrite', os => { if (os) os.delete(key); else memory.kv.delete(key); });

      try {
        if (active) localStorage.setItem('ironlog.active', JSON.stringify(active));

        }

    }

function beep() {
  if (!S.settings.restSound || !audioCtx) return;
  try {
    const t0 = audioCtx.currentTime;
    [0, 0.18, 0.36].forEach((d, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = i === 2 ? 1175 : 880;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.15);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0 + d); o.stop(t0 + d + 0.16);
    });
  } catch (e) {}
}

function fmtDur(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
}
function fmtMins(ms) {

}

function fmtDateLong(t) { return new Date(t).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }

// ---------- sheets & dialogs ----------
let sheetStack = [];
function openSheet(html, cls, onMount) {
  return new Promise(resolve => {
    const scrim = document.createElement('div'); scrim.id = 'scrim';
    const sh = document.createElement('div'); sh.className = 'sheet ' + (cls || '');
    sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-modal', 'true');
    sh.innerHTML = (cls && cls.includes('actsheet') ? '' : '<div class="grab"></div>') + html;
    document.body.append(scrim, sh);
    const entry = { scrim, sh, resolve };
    sheetStack.push(entry);
    requestAnimationFrame(() => { scrim.classList.add('on'); sh.classList.add('on'); });
    scrim.addEventListener('click', () => closeSheet(null));
    if (onMount) onMount(sh, v => closeSheet(v));
  });
}
function closeSheet(value) {
  const e = sheetStack.pop();
  if (!e) return;
  e.scrim.classList.remove('on'); e.sh.classList.remove('on');
  setTimeout(() => { e.scrim.remove(); e.sh.remove(); }, 300);
  e.resolve(value);
}

// ---------- navigation ----------
function stack() { return S.ui.stacks[S.ui.tab]; }
function currentView() { const st = stack(); return st.length ? st[st.length - 1] : { view: S.ui.tab }; }
function viewKey() { return S.ui.tab + ':' + stack().length; }
function push(view, params) {
  S.ui.scroll[viewKey()] = $('#main').scrollTop;
  stack().push(Object.assign({ view }, params || {}));
  render(); $('#main').scrollTop = 0;
}
function pop() {
  stack().pop();
  render();
  $('#main').scrollTop = S.ui.scroll[viewKey()] || 0;
}
function switchTab(tab) {

    if (stack().length) { S.ui.stacks[tab] = []; render(); }
    $('#main').scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  S.ui.scroll[viewKey()] = $('#main').scrollTop;

  render();

}

// ---------- charts ----------
const chartData = {};
let chartSeq = 0;
function chartSlot(cfg, cls) {
  const id = 'ch' + (++chartSeq);
  chartData[id] = cfg;
  return `<div class="chart ${cls || ''}" data-chart="${id}"></div>`;
}
function niceTicks(min, max, n) {
  if (min === max) { const pad = Math.abs(min) * 0.1 || 1; min -= pad; max += pad; }
  const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => span / x <= n) || mag * 10;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = []; for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(6));
  return { lo, hi, ticks };
}
function fmtTick(v) { return Math.abs(v) >= 10000 ? (v / 1000).toFixed(0) + 'k' : Math.abs(v) >= 1000 ? (v / 1000).toFixed(1) + 'k' : (+v.toFixed(1)).toString(); }
function drawCharts(root) {
  $$('[data-chart]', root).forEach(el => {
    const cfg = chartData[el.dataset.chart]; if (!cfg) return;
    const W = el.clientWidth || 320, H = el.clientHeight || 190;
    const padL = 36, padR = 10, padT = 18, padB = 22;
    const pts = cfg.points;
    if (!pts.length) { el.innerHTML = `<div class="empty" style="padding:60px 0">No data yet</div>`; return; }
    const ys = pts.map(p => p.y);
    const { lo, hi, ticks } = niceTicks(cfg.zero ? 0 : Math.min(...ys), Math.max(...ys), 4);
    const iw = W - padL - padR, ih = H - padT - padB;
    const Y = v => padT + ih - (v - lo) / ((hi - lo) || 1) * ih;
    let X, xLabels = [];
    if (cfg.type === 'bar') {
      const bw = iw / pts.length;
      X = i => padL + bw * i + bw / 2;
      const barW = Math.max(3, Math.min(28, bw * 0.62));
      const step = Math.ceil(pts.length / 7);
      pts.forEach((p, i) => { if (i % step === 0 || i === pts.length - 1) xLabels.push([X(i), p.label]); });
      el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${ticks.map(t => `<line class="gridline" x1="${padL}" x2="${W - padR}" y1="${Y(t)}" y2="${Y(t)}"/><text class="axis" x="${padL - 6}" y="${Y(t) + 3.5}" text-anchor="end">${fmtTick(t)}</text>`).join('')}
        ${pts.map((p, i) => `<rect x="${X(i) - barW / 2}" y="${Y(p.y)}" width="${barW}" height="${Math.max(0, Y(lo) - Y(p.y))}" rx="${Math.min(4, barW / 2)}" fill="${p.color || 'var(--accent)'}" opacity="${p.dim ? .35 : 1}"/>`).join('')}
        ${dedupeLabels(xLabels).map(([x, l]) => `<text class="axis" x="${x}" y="${H - 5}" text-anchor="middle">${esc(l)}</text>`).join('')}</svg><div class="tip hidden"></div>`;
    } else {
      const t0 = pts[0].x, t1 = pts[pts.length - 1].x;
      X = i => pts.length === 1 ? padL + iw / 2 : padL + (pts[i].x - t0) / ((t1 - t0) || 1) * iw;
      const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
      const area = `${path}L${X(pts.length - 1).toFixed(1)},${Y(lo)}L${X(0).toFixed(1)},${Y(lo)}Z`;
      const n = 4;
      for (let k = 0; k < n; k++) {
        const tt = pts.length === 1 ? t0 : t0 + (t1 - t0) * k / (n - 1);
        const x = pts.length === 1 ? padL + iw / 2 : padL + iw * k / (n - 1);
        xLabels.push([x, new Date(tt).toLocaleDateString(undefined, (t1 - t0) > 300 * 864e5 ? { month: 'short', year: '2-digit' } : { day: 'numeric', month: 'short' })]);
        if (pts.length === 1) break;
      }
      const gid = 'g' + el.dataset.chart;
      el.innerHTML = `<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
        ${ticks.map(t => `<line class="gridline" x1="${padL}" x2="${W - padR}" y1="${Y(t)}" y2="${Y(t)}"/><text class="axis" x="${padL - 6}" y="${Y(t) + 3.5}" text-anchor="end">${fmtTick(t)}</text>`).join('')}
        <path d="${area}" fill="url(#${gid})"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${pts.length <= 40 ? pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="3.2" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`).join('') : ''}
        <line class="cursor hidden" y1="${padT}" y2="${padT + ih}" stroke="var(--text2)" stroke-width="1" stroke-dasharray="3 3"/>
        <circle class="cdot hidden" r="5.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
        ${xLabels.map(([x, l], k) => `<text class="axis" x="${x}" y="${H - 5}" text-anchor="${k === 0 && xLabels.length > 1 ? 'start' : k === xLabels.length - 1 && xLabels.length > 1 ? 'end' : 'middle'}">${esc(l)}</text>`).join('')}</svg><div class="tip hidden"></div>`;
    }
    // touch / mouse readout
    const tip = el.querySelector('.tip'), cur = el.querySelector('.cursor'), cdot = el.querySelector('.cdot');
    const show = ev => {
      const r = el.getBoundingClientRect();
      const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
      let best = 0, bd = Infinity;
      pts.forEach((p, i) => { const d = Math.abs(X(i) - px); if (d < bd) { bd = d; best = i; } });
      const p = pts[best], x = X(best);
      tip.textContent = cfg.tip ? cfg.tip(p) : String(p.y);
      tip.style.left = Math.min(Math.max(x, 50), W - 50) + 'px';
      tip.classList.remove('hidden');
      if (cur) { cur.setAttribute('x1', x); cur.setAttribute('x2', x); cur.classList.remove('hidden'); cdot.setAttribute('cx', x); cdot.setAttribute('cy', Y(p.y)); cdot.classList.remove('hidden'); }
    };
    const hide = () => { tip.classList.add('hidden'); if (cur) { cur.classList.add('hidden'); cdot.classList.add('hidden'); } };
    el.onpointerdown = show; el.onpointermove = e => { if (e.pointerType === 'mouse' || e.buttons) show(e); };
    el.ontouchmove = show; el.onpointerleave = hide; el.ontouchend = () => setTimeout(hide, 1600);
  });
}
function dedupeLabels(ls) { const out = []; let lastX = -99; for (const l of ls) { if (l[0] - lastX > 30) { out.push(l); lastX = l[0]; } } return out; }
function sparkline(vals) {
  if (vals.length < 2) return '<svg class="spark"></svg>';
  const mn = Math.min(...vals), mx = Math.max(...vals);
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * 62 + 1).toFixed(1)},${(24 - (v - mn) / ((mx - mn) || 1) * 22).toFixed(1)}`).join(' ');
  const up = vals[vals.length - 1] >= vals[0];
  return `<svg class="spark" viewBox="0 0 64 26"><polyline points="${pts}" fill="none" stroke="${up ? 'var(--done)' : 'var(--danger)'}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function ring(pct, label) {
  const r = 27, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct));
  return `<div class="ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--fill)" stroke-width="7"/>
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c * p} ${c}"/></svg>
    <div class="lbl">${label}</div></div>`;
}

// ---------- file export ----------
async function shareFile(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  try {
    const file = new File([blob], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return true;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return false;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}

function topPRs(events) {

}

// ---------------- HOME ----------------
function weekInfo(now) {
  const plan = activePlan();
  const sched = plan ? plan.schedule : [null, null, null, null, null, null, null];
  const ws = GL.startOfWeek(now);
  const doneDays = new Set(finishedSessions().map(s => GL.dayKey(s.start)));
  const today = GL.startOfDay(now);
  const days = [];
  let scheduled = 0, hit = 0;
  for (let i = 0; i < 7; i++) {
    const t = GL.addDays(ws, i);
    const di = sched[i];
    const done = doneDays.has(GL.dayKey(t));
    if (di != null) { scheduled++; if (done) hit++; }
    days.push({ t, i, day: di != null && plan ? plan.days[di] : null, done, today: t === today, past: t < today });
  }
  const extra = days.filter(d => d.done && !d.day).length;
  return { days, scheduled, hit: Math.min(scheduled, hit + extra), sched };
}

      <p>${S.settings.lastBackup ? `Last backup ${esc(relDay(S.settings.lastBackup))}.` : 'You haven\'t made a backup yet.'} Save a copy to Files or iCloud Drive.</p>

function greeting() {
  const h = new Date().getHours();
  return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
}
function shortName(n) {
  const s = n.replace(/ & /g, '/');
  return s.length > 9 ? s.split(/[\s/]/)[0] : s;
}
function nextScheduled(now) {
  const p = activePlan(); if (!p) return null;
  for (let i = 1; i <= 7; i++) {
    const t = GL.addDays(GL.startOfDay(now), i);
    const di = p.schedule[GL.monIndex(t)];
    if (di != null && p.days[di]) return { t, day: p.days[di] };
  }
  return null;
}

function historySection() {
  const fin = finishedSessions().slice().reverse();
  if (!fin.length) return `<div class="empty"><b>No workouts logged</b>Finished workouts are saved here with every set.</div>`;
  const groups = [];
  for (const s of fin) {
    const k = new Date(s.start).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    if (!groups.length || groups[groups.length - 1].k !== k) groups.push({ k, items: [] });
    groups[groups.length - 1].items.push(s);
  }
  const prCount = {};
  for (const e of topPRs(records().events)) prCount[e.sessionId] = (prCount[e.sessionId] || 0) + 1;
  return groups.map(g => `<div class="group-label">${esc(g.k)} · ${g.items.length} workout${g.items.length === 1 ? '' : 's'}</div>
    <div class="group">${g.items.map(s => `<button class="row" data-a="openSession" data-id="${s.id}">
      <div class="grow"><div class="title">${esc(s.name)}</div><div class="meta">${esc(fmtDate(s.start))} · ${fmtMins(s.end - s.start)} · ${vol(s.volume || 0)}</div></div>
      ${prCount[s.id] ? `<span class="pr-badge">${I.trophy} ${prCount[s.id]}</span>` : ''}${I.chevR.replace('<svg', '<svg class="chev"')}</button>`).join('')}</div>`).join('');
}

function libraryList(mode, selected) {
  const m = S.ui.libM;

  return groups.map(([name, exs]) => `<div class="lib-group"><div class="lib-letter">${esc(name)}</div><div class="group">${exs.map(e => {
    const sel = selected && selected.includes(e.id);

    ${prs.length && !edit ? `<div class="group-label">Records in this workout</div><div class="group">${prs.map(e => `<div class="row"><span class="pr-badge">${I.trophy} PR</span><div class="grow"><div class="title">${esc(exById(e.exId).name)}</div><div class="meta">${esc(prLabel(e))}</div></div></div>`).join('')}</div>` : ''}

      <div class="stat"><div class="k">Volume</div><div class="v">${GL.fmtVolume(s.volume || 0, U())}<small>${U()}</small></div></div>
      <div class="stat"><div class="k">Sets completed</div><div class="v">${GL.sessionSetCount(s)}</div></div>
      <div class="stat"><div class="k">Exercises</div><div class="v">${exIds.length}</div></div></div>
    <div class="section-h"><h2>Personal records</h2><h3>${prs.length}</h3></div>
    ${prs.length ? `<div class="group">${prs.map(e => `<div class="row"><span class="icon-dot" style="background:var(--pr-soft);color:var(--pr)">${I.trophy}</span><div class="grow"><div class="title">${esc(exById(e.exId).name)}</div><div class="meta">${esc(prLabel(e))}</div></div></div>`).join('')}</div>`
      : `<div class="group"><div class="row" style="color:var(--text2);font-size:15px">No new records this time. Consistent sessions are what build them.</div></div>`}
    <div class="section-h"><h2>Exercises</h2></div>
    <div class="group">${s.exercises.map(ex => {
      const sets = GL.workingSets(ex); if (!sets.length) return '';
      const best = sets.reduce((a, b) => GL.e1rm(b.w, b.r) > GL.e1rm(a.w, a.r) ? b : a);
      return `<button class="row" data-a="openExercise" data-id="${ex.exId}"><div class="grow"><div class="title">${esc(exById(ex.exId).name)}</div>
        <div class="meta num">${sets.map(setStr).join(' · ')}</div></div><span class="val num">${esc(setStr(best))}</span></button>`;
    }).join('')}</div>
    ${exIds.some(id => S.suggestions[id] && S.suggestions[id].sessionId === s.id && S.suggestions[id].status === 'pending') ? `
    <div class="section-h"><h2>Next time</h2></div>
    <p style="color:var(--text2);font-size:15px;margin:-2px 4px 10px">Suggestions from today's sets. Nothing changes unless you accept.</p>
    ${exIds.map(id => S.suggestions[id] && S.suggestions[id].sessionId === s.id ? `<div class="exc" style="padding:12px 0 2px"><div style="padding:0 16px 4px;font-weight:600">${esc(exById(id).name)}</div>${sugBlock(id)}</div>` : '').join('')}` : ''}
    <button class="btn block" style="margin-top:16px" data-a="back">Done</button><div style="height:20px"></div></div>`;
}

// suggestion banner (used in workout and summary)
function sugText(sg) {
  if (sg.kind === 'up') return sg.weight ? `Go up to ${wu(sg.weight)} × ${sg.repMin}–${sg.repMax}` : `Add load or reps`;
  if (sg.kind === 'down') return `Drop to ${wu(sg.weight)} × ${sg.repMin}–${sg.repMax}`;
  if (sg.kind === 'hold') return `Stay at ${wu(sg.weight)}`;
  return sg.weight ? `Stay at ${wu(sg.weight)}, add a rep` : `Add a rep per set`;
}
function sugBlock(exId) {
  const sg = S.suggestions[exId];
  if (!sg || sg.status === 'rejected') return '';
  if (sg.status === 'accepted') {
    return `<div class="sug accepted"><div class="what">${I.check.replace('<svg', '<svg width="15" height="15" style="vertical-align:-2px"')} Next target: ${esc(sugText(sg))}</div>
      <div class="why" style="margin:0">You accepted this. <button style="color:var(--accent);font-size:14px" data-a="sugUndo" data-id="${exId}">Undo</button></div></div>`;
  }
  const changes = sg.kind === 'up' || sg.kind === 'down';
  return `<div class="sug"><div class="what">${esc(sugText(sg))}</div><div class="why">${esc(sg.reason)}</div>
    <div class="btn-row"><button class="btn" data-a="sugAccept" data-id="${exId}">${changes ? 'Accept' : 'Got it'}</button>
    ${changes ? `<button class="btn secondary" data-a="sugModify" data-id="${exId}">Change</button>` : ''}
    <button class="btn secondary" data-a="sugReject" data-id="${exId}">${changes ? 'Reject' : 'Dismiss'}</button></div></div>`;
}

// ---------------- PROGRESS TAB ----------------
function viewProgress() {
  const seg = S.ui.seg.progress;
  const segs = [['exercises', 'Exercises'], ['analytics', 'Analytics'], ['body', 'Body']];
  const right = seg === 'body' ? `<button class="navbtn strong" data-a="push" data-v="bodyEntry" aria-label="Add measurement">${I.plus}</button>` : '';
  const body = seg === 'exercises' ? exerciseProgressList() : seg === 'analytics' ? analytics() : bodySection();
  return `<div class="page">${largeTitle('Progress', '', right)}
    <div class="seg" role="group">${segs.map(([k, l]) => `<button aria-pressed="${seg === k}" data-a="seg" data-tab="progress" data-k="${k}">${l}</button>`).join('')}</div>
    ${body}</div>`;
}

function exerciseProgressList() {
  const ids = new Map();
  for (const s of finishedSessions()) for (const ex of s.exercises) if (GL.workingSets(ex).length) ids.set(ex.exId, s.start);
  if (!ids.size) return `<div class="empty"><b>No progress yet</b>Finish a workout and each exercise gets its own chart here.<br><button class="btn" data-a="tab" data-tab="home">Go to today's workout</button></div>`;
  const rows = [...ids.entries()].sort((a, b) => b[1] - a[1]).map(([id]) => {
    const h = history(id); const ex = exById(id);
    const last = h[h.length - 1];
    const best = Math.max(...h.map(x => x.e1rm));
    const vals = h.slice(-12).map(x => x.e1rm || x.maxReps);
    return `<button class="row" data-a="openExercise" data-id="${id}"><div class="grow"><div class="title">${esc(ex.name)}</div>
      <div class="meta">${last.top ? `Last ${esc(w(last.top))} × ${last.topR}` : `Last ${last.maxReps} reps`}${best ? ` · Best 1RM ${esc(wu(best))}` : ''}</div></div>${sparkline(vals)}${I.chevR.replace('<svg', '<svg class="chev"')}</button>`;
  });
  return `<div class="group" style="margin-top:8px">${rows.join('')}</div><div class="group-foot">Sorted by most recently trained. 1RM is estimated from your best set (Epley formula).</div>`;
}

function viewExercise(v) {
  const ex = exById(v.id);
  const h = history(v.id);
  const metric = v.metric || 'e1rm';
  const range = v.range || 'all';
  const cut = { '1m': 31, '3m': 92, '6m': 183, '1y': 366 }[range];
  const hh = cut ? h.filter(x => x.date >= Date.now() - cut * 864e5) : h;
  const val = x => metric === 'e1rm' ? x.e1rm : metric === 'top' ? x.top : metric === 'volume' ? x.volume : x.maxReps;
  const isW = metric !== 'reps';
  const pts = hh.map(x => ({ x: x.date, y: isW ? GL.toDisplay(val(x), U()) : val(x), d: x.date }));
  const tip = p => `${isW ? (+p.y.toFixed(1)) + ' ' + U() : p.y + ' reps'} · ${fmtDate(p.d, { day: 'numeric', month: 'short', year: '2-digit' })}`;
  const bw = h.length && h[h.length - 1].top === 0 && ex.equipment === 'bodyweight';
  const metrics = (bw ? [['reps', 'Best reps']] : [['e1rm', 'Est. 1RM'], ['top', 'Top weight'], ['volume', 'Volume'], ['reps', 'Best reps']]);
  const bestTop = h.reduce((a, x) => x.top > a.top || (x.top === a.top && x.topR > a.topR) ? x : a, { top: 0, topR: 0 });
  const best1 = Math.max(0, ...h.map(x => x.e1rm));
  const first = h[0], last = h[h.length - 1];
  const change = first && last && first.e1rm ? (last.e1rm - first.e1rm) / first.e1rm * 100 : null;
  const head = pts.length ? (isW ? `${(+pts[pts.length - 1].y.toFixed(1))}<small style="font-size:15px;color:var(--text2)"> ${U()}</small>` : `${pts[pts.length - 1].y}<small style="font-size:15px;color:var(--text2)"> reps</small>`) : '–';
  const rmt = GL.repMaxTable(h).slice(0, 10);
  const recs = topPRs(records().events.filter(e => e.exId === v.id)).slice(-6).reverse();
  ensureSuggestion(v.id);
  const sg = S.suggestions[v.id];
  return `<div class="page">${navbar(ex.name, ex.custom ? `<button class="navbtn" data-a="editCustom" data-id="${ex.id}">Edit</button>` : '')}
    <div style="padding:4px 4px 10px"><h1 style="font-size:28px;margin:4px 0 2px;line-height:1.15">${esc(ex.name)}</h1>
    <div style="color:var(--text2);font-size:15px">${esc(GL.MUSCLE_NAME[ex.muscle])} · ${esc(GL.EQUIPMENT_NAME[ex.equipment] || '')} · ${ex.kind === 'c' ? 'Compound' : 'Isolation'}</div></div>
    ${!h.length ? `<div class="group"><div class="empty"><b>Not trained yet</b>Log this exercise in a workout and its progress shows up here.</div></div>` : `
    <div class="chips" style="margin-bottom:8px">${metrics.map(([k, l]) => `<button class="pill" aria-pressed="${metric === k}" data-a="exMetric" data-k="${k}">${l}</button>`).join('')}</div>
    <div class="chart-card"><div class="ch-head"><b>${head}</b><span>${{ e1rm: 'Estimated 1RM', top: 'Heaviest set', volume: 'Volume per workout', reps: 'Most reps in a set' }[metric]}</span></div>
      ${chartSlot({ points: pts, tip })}
      <div class="seg" style="margin-top:8px">${[['1m', '1M'], ['3m', '3M'], ['6m', '6M'], ['1y', '1Y'], ['all', 'All']].map(([k, l]) => `<button aria-pressed="${range === k}" data-a="exRange" data-k="${k}">${l}</button>`).join('')}</div></div>
    <div class="stats" style="margin-top:10px">
      <div class="stat"><div class="k">Best set</div><div class="v" style="font-size:22px">${bestTop.top ? `${w(bestTop.top)}<small>${U()} × ${bestTop.topR}</small>` : `${Math.max(...h.map(x => x.maxReps))}<small>reps</small>`}</div></div>
      <div class="stat"><div class="k">Best est. 1RM</div><div class="v" style="font-size:22px">${best1 ? `${w(best1)}<small>${U()}</small>` : '–'}</div></div>
      <div class="stat"><div class="k">Sessions</div><div class="v" style="font-size:22px">${h.length}</div><div class="d">since ${esc(fmtDate(first.date, { day: 'numeric', month: 'short', year: '2-digit' }))}</div></div>
      <div class="stat"><div class="k">1RM change</div><div class="v ${change > 0 ? 'up' : change < 0 ? 'down' : ''}" style="font-size:22px">${change == null ? '–' : (change > 0 ? '+' : '') + change.toFixed(0) + '%'}</div><div class="d">first vs latest</div></div></div>
    ${sg && sg.status !== 'rejected' ? `<div class="section-h"><h2>Next time</h2></div><div class="exc" style="padding-top:6px">${sugBlock(v.id)}</div>` : ''}
    ${rmt.length && rmt[0].w ? `<div class="group-label">Most reps at each weight</div><div class="group">${rmt.map(r => `<div class="row"><div class="grow num">${esc(wu(r.w))}</div><span class="val num">${r.r} reps · ${esc(fmtDate(r.date, { day: 'numeric', month: 'short' }))}</span></div>`).join('')}</div>` : ''}
    ${recs.length ? `<div class="group-label">Personal records</div><div class="group">${recs.map(e => `<div class="row"><span class="pr-badge">${I.trophy}</span><div class="grow"><div class="title" style="font-size:16px">${esc(prLabel(e))}</div></div><span class="val">${esc(relDay(e.date))}</span></div>`).join('')}</div>` : ''}
    <div class="group-label">History</div>
    <div class="group">${h.slice().reverse().slice(0, 30).map(x => `<button class="row" data-a="openSession" data-id="${x.sessionId}"><div class="grow"><div class="title" style="font-size:16px">${esc(fmtDate(x.date))}</div>
      <div class="meta num">${x.sets.map(setStr).join(' · ')}</div></div>${I.chevR.replace('<svg', '<svg class="chev"')}</button>`).join('')}</div>`}
    ${ex.custom ? `<div class="group" style="margin-top:26px"><button class="row danger" data-a="deleteCustom" data-id="${ex.id}"><div class="grow"><div class="title">Delete custom exercise</div></div></button></div>` : ''}
    <div style="height:20px"></div></div>`;
}

function analytics() {
  const fin = finishedSessions();
  if (!fin.length) return `<div class="empty"><b>No data yet</b>Your training frequency, volume and records show up after your first workout.</div>`;
  const now = Date.now();
  const mode = S.ui.anRange || 'weeks';
  const buckets = [];
  if (mode === 'weeks') {
    const ws = GL.startOfWeek(now);
    for (let i = 11; i >= 0; i--) { const a = GL.addDays(ws, -7 * i); buckets.push({ a, b: GL.addDays(a, 7), label: new Date(a).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) }); }
  } else {
    const d = new Date(now);
    for (let i = 11; i >= 0; i--) { const a = new Date(d.getFullYear(), d.getMonth() - i, 1).getTime(); const b = new Date(d.getFullYear(), d.getMonth() - i + 1, 1).getTime(); buckets.push({ a, b, label: new Date(a).toLocaleDateString(undefined, { month: 'short' }) }); }
  }
  for (const b of buckets) { b.n = 0; b.v = 0; for (const s of fin) if (s.start >= b.a && s.start < b.b) { b.n++; b.v += s.volume || 0; } }
  const freqPts = buckets.map((b, i) => ({ y: b.n, label: b.label, dim: i === buckets.length - 1 }));
  const volPts = buckets.map((b, i) => ({ y: GL.toDisplay(b.v, U()), label: b.label, dim: i === buckets.length - 1 }));
  const avg = (buckets.slice(0, -1).reduce((a, b) => a + b.n, 0) / (buckets.length - 1));
  const period = mode === 'weeks' ? 'week' : 'month';

  // sets per muscle
  const mDays = S.ui.anDays || 30;
  const per = {};
  for (const s of fin) if (s.start >= now - mDays * 864e5) for (const ex of s.exercises) {
    const m = exById(ex.exId).muscle; per[m] = (per[m] || 0) + GL.workingSets(ex).length;
  }
  const mrows = GL.MUSCLES.map(([k, n]) => [k, n, per[k] || 0]).sort((a, b) => b[2] - a[2]);
  const mmax = Math.max(1, ...mrows.map(r => r[2]));

  // consistency (last 4 full weeks + this week so far, excluding today)
  const plan = activePlan();
  const from = GL.addDays(GL.startOfWeek(now), -28);
  const to = GL.startOfDay(now);
  let schedN = 0;
  if (plan) for (let t = from; t < to; t = GL.addDays(t, 1)) if (plan.schedule[GL.monIndex(t)] != null) schedN++;
  const missed = plan ? GL.missedDays(S.sessions, plan.schedule, from, to, plan.days.map(d => d.name)) : [];
  const consistency = schedN ? (schedN - missed.length) / schedN : null;
  const st = GL.streak(S.sessions, plan ? plan.schedule : null, now);

  // most improved: last 90 days, first session vs best of the latest three
  const improved = [];
  const seen = new Set(fin.flatMap(s => s.exercises.map(e => e.exId)));
  for (const id of seen) {
    const h = history(id).filter(x => x.date >= now - 90 * 864e5 && x.e1rm > 0);
    if (h.length < 2) continue;
    const a = h[0].e1rm, b = Math.max(...h.slice(-3).map(x => x.e1rm));
    if (b > a) improved.push({ id, pct: (b - a) / a * 100, a, b });
  }
  improved.sort((x, y) => y.pct - x.pct);
  const allPRs = topPRs(records().events);
  const recs = allPRs.slice(-10).reverse();

  return `<div class="seg" style="margin-top:10px">${[['weeks', 'Weekly'], ['months', 'Monthly']].map(([k, l]) => `<button aria-pressed="${mode === k}" data-a="anRange" data-k="${k}">${l}</button>`).join('')}</div>
    <div class="section-h"><h2>Workouts</h2><h3>avg ${avg.toFixed(1)} per ${period}</h3></div>
    <div class="chart-card">${chartSlot({ type: 'bar', zero: true, points: freqPts, tip: p => `${p.label}: ${p.y} workout${p.y === 1 ? '' : 's'}` }, 'short')}</div>
    <div class="section-h"><h2>Volume</h2><h3>${U()} lifted per ${period}</h3></div>
    <div class="chart-card">${chartSlot({ type: 'bar', zero: true, points: volPts, tip: p => `${p.label}: ${Math.round(p.y).toLocaleString()} ${U()}` }, 'short')}</div>
    <div class="group-foot">The latest ${period} is shown lighter because it isn't finished.</div>

    <div class="section-h"><h2>Consistency</h2><h3>last 4 weeks</h3></div>
    <div class="stats">
      <div class="stat" style="display:flex;align-items:center;gap:12px;grid-column:1/-1">${ring(consistency == null ? 0 : consistency, consistency == null ? '–' : Math.round(consistency * 100) + '%')}
        <div><div class="k">Scheduled workouts done</div><div class="v" style="font-size:20px">${schedN - missed.length} of ${schedN}</div><div class="d">Streak: ${st.value} ${st.unit === 'week' ? 'weeks' : 'in a row'}</div></div></div></div>
    ${missed.length ? `<div class="group-label">Missed workouts</div><div class="group">${missed.slice().reverse().slice(0, 8).map(m => `<div class="row"><div class="grow"><div class="title" style="font-size:16px">${esc(m.day)}</div></div><span class="val">${esc(fmtDate(m.date))}</span></div>`).join('')}</div>` : ''}

    <div class="section-h"><h2>Sets per muscle</h2><button class="link" data-a="anDays">${mDays === 30 ? 'Last 30 days' : 'Last 7 days'}</button></div>
    <div class="group" style="padding:8px 16px">${mrows.map(([k, n, c]) => `<div class="hbar"><span class="nm">${esc(n)}</span><span class="tr"><i style="width:${c / mmax * 100}%;background:${muscleColor(k)}"></i></span><span class="n">${c}</span></div>`).join('')}</div>
    <div class="group-foot">Completed working sets, warm-ups excluded.</div>

    <div class="section-h"><h2>Most improved</h2><h3>est. 1RM, 90 days</h3></div>
    ${improved.length ? `<div class="group">${improved.slice(0, 5).map(x => `<button class="row" data-a="openExercise" data-id="${x.id}"><div class="grow"><div class="title">${esc(exById(x.id).name)}</div><div class="meta">${esc(wu(x.a))} → ${esc(wu(x.b))}</div></div><span class="val up" style="font-weight:600">+${x.pct.toFixed(0)}%</span></button>`).join('')}</div>`
      : `<div class="group"><div class="row" style="color:var(--text2);font-size:15px">Log an exercise at least twice to see how it's improving.</div></div>`}

    <div class="section-h"><h2>Personal records</h2><h3>${allPRs.length} total</h3></div>
    ${recs.length ? `<div class="group">${recs.map(e => `<button class="row" data-a="openExercise" data-id="${e.exId}"><span class="pr-badge">${I.trophy}</span><div class="grow"><div class="title" style="font-size:16px">${esc(exById(e.exId).name)}</div><div class="meta">${esc(prLabel(e))}</div></div><span class="val">${esc(relDay(e.date))}</span></button>`).join('')}</div>`
      : `<div class="group"><div class="row" style="color:var(--text2);font-size:15px">Beat a previous best and it shows up here.</div></div>`}
    <div style="height:12px"></div>`;
}

// ---------------- BODY ----------------
const BODY_METRICS = [
  ['weight', 'Body weight', 'w'], ['bf', 'Body fat', '%'], ['chest', 'Chest', 'len'],
  ['waist', 'Waist', 'len'], ['arm', 'Arm', 'len'], ['thigh', 'Thigh', 'len']
];
const CM_PER_IN = 2.54;
function bodyVal(key, v) {
  if (v == null) return null;
  const kind = BODY_METRICS.find(m => m[0] === key)[2];
  if (kind === 'w') return GL.toDisplay(v, U());
  if (kind === 'len') return S.settings.lenUnit === 'in' ? GL.round(v / CM_PER_IN, 1) : GL.round(v, 1);
  return GL.round(v, 1);
}
function bodyUnit(key) {
  const kind = BODY_METRICS.find(m => m[0] === key)[2];
  return kind === 'w' ? U() : kind === 'len' ? S.settings.lenUnit : '%';
}
function bodySection() {
  const b = S.body;
  if (!b.length) return `<div class="empty"><b>Track your body</b>Log weight, body fat, measurements and progress photos whenever you like. It stays separate from workouts.<br><button class="btn" data-a="push" data-v="bodyEntry">Add first entry</button></div>`;
  const metric = S.ui.bodyMetric || 'weight';
  const has = BODY_METRICS.filter(m => b.some(x => x[m[0]] != null));
  const met = has.find(m => m[0] === metric) || has[0];
  const series = met ? b.filter(x => x[met[0]] != null).map(x => ({ x: x.date, y: bodyVal(met[0], x[met[0]]), d: x.date })) : [];
  const photos = b.filter(x => x.photo);
  return `<div class="stats" style="margin-top:10px">${has.map(([k, name]) => {
      const vals = b.filter(x => x[k] != null);
      const first = vals[0][k], last = vals[vals.length - 1][k];
      const diff = bodyVal(k, last) - bodyVal(k, first);
      return `<button class="stat" style="text-align:left" data-a="bodyMetric" data-k="${k}"><div class="k">${esc(name)}</div><div class="v" style="font-size:22px">${bodyVal(k, last)}<small>${bodyUnit(k)}</small></div>
        <div class="d">${vals.length > 1 ? `${diff > 0 ? '+' : ''}${GL.round(diff, 1)} since ${esc(fmtDate(vals[0].date, { day: 'numeric', month: 'short' }))}` : 'First entry'}</div></button>`;
    }).join('')}</div>
    ${met ? `<div class="section-h"><h2>${esc(met[1])}</h2><h3>${bodyUnit(met[0])}</h3></div>
    <div class="chips" style="margin-bottom:8px">${has.map(([k, n]) => `<button class="pill" aria-pressed="${met[0] === k}" data-a="bodyMetric" data-k="${k}">${esc(n)}</button>`).join('')}</div>
    <div class="chart-card">${chartSlot({ points: series, tip: p => `${p.y} ${bodyUnit(met[0])} · ${fmtDate(p.d, { day: 'numeric', month: 'short', year: '2-digit' })}` })}</div>` : ''}
    ${photos.length ? `<div class="section-h"><h2>Photos</h2>${photos.length > 1 ? `<button class="link" data-a="push" data-v="compare">Compare</button>` : ''}</div>
      <div class="chips">${photos.slice().reverse().map(x => `<button data-a="push" data-v="bodyEntry" data-id="${x.id}" style="flex:none"><img class="photo-thumb" style="width:84px;height:112px" src="${x.photo}" alt="Progress photo ${esc(fmtDate(x.date))}"></button>`).join('')}</div>` : ''}
    <div class="group-label">Entries</div>
    <div class="group">${b.slice().reverse().map(x => `<button class="row" data-a="push" data-v="bodyEntry" data-id="${x.id}">
